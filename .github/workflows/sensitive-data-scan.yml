name: Sensitive data scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets and AWS identifiers
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          args=(--verbose --redact --config=/path/gitleaks.toml)
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            args+=(--log-opts="${PR_BASE_SHA}..${GITHUB_SHA}")
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            args+=(--log-opts="${PUSH_BASE_SHA}..${GITHUB_SHA}")
          fi

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/path" \
            zricethezav/gitleaks:v8.30.1 \
            git "${args[@]}" /path